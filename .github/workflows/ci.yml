name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  lintandtest:
    runs-on: ubuntu-latest

    services:
      mariadb:
        image: mariadb:latest
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: assignment_app_test
          MARIADB_AUTO_UPGRADE: 1
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mariadb-admin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.2'
        extensions: mbstring, xml, ctype, iconv, intl, pdo_mysql, dom, filter, gd, json, zip
        coverage: none

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: package-lock.json

    - name: Cache Composer dependencies
      uses: actions/cache@v4
      with:
        path: /vendor
        key: ${{ runner.os }}-composer-${{ hashFiles('composer.lock') }}
        restore-keys: |
          ${{ runner.os }}-composer-

    - name: Install Composer dependencies
      run: composer install --prefer-dist --no-progress --no-interaction

    - name: Install npm dependencies
      run: npm ci

    - name: Build frontend assets
      run: npm run build

    - name: Copy .env file
      run: cp .env.example .env

    - name: Generate application key
      run: php artisan key:generate

    - name: Run migrations on MariaDB
      env:
        DB_CONNECTION: mariadb
        DB_HOST: 127.0.0.1
        DB_PORT: 3306
        DB_DATABASE: assignment_app_test
        DB_USERNAME: root
        DB_PASSWORD: root
      run: php artisan migrate --force

    - name: Run PHP_CodeSniffer & PHPStan
      run: composer lint

    - name: Run PHPUnit tests
      env:
        APP_ENV: testing
        DB_CONNECTION: mariadb
        DB_HOST: 127.0.0.1
        DB_PORT: 3306
        DB_DATABASE: assignment_app_test
        DB_USERNAME: root
        DB_PASSWORD: root
      run: php artisan test
